name: GXDE GXTK7 Fedora
on:
  push:
    paths: ['packages/gxde-gxtk7/**', 'scripts/gxde-gxtk7-sources.py',
            'scripts/build-fedora-gxde-gxtk7.sh', 'tests/**',
            '.github/workflows/gxde-gxtk7.yml']
  pull_request:
    paths: ['packages/gxde-gxtk7/**', 'scripts/gxde-gxtk7-sources.py',
            'scripts/build-fedora-gxde-gxtk7.sh', 'tests/**',
            '.github/workflows/gxde-gxtk7.yml']
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: gxde-gxtk7-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sources:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - id: resolve
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == schedule || "$EVENT" == workflow_dispatch ]]; then
            python3 scripts/gxde-gxtk7-sources.py update
          fi
          if [[ "$EVENT" != schedule ]] || ! git diff --quiet -- packages/gxde-gxtk7/upstream-lock.json; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
            python3 scripts/gxde-gxtk7-sources.py prepare --package all
          fi
      - uses: actions/upload-artifact@v4
        if: steps.resolve.outputs.build == 'true'
        with:
          name: gxde-gxtk7-sources
          path: |
            build/gxde-bernese-rpmbuild/SOURCES
            build/gxde-bernese-rpmbuild/SPECS
            build/gxde-gxtk7-rpmbuild/SOURCES
            build/gxde-gxtk7-rpmbuild/SPECS
            packages/gxde-gxtk7/upstream-lock.json

  build:
    needs: sources
    if: needs.sources.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gxde-gxtk7-sources
          path: .
      - name: Build and install in Fedora 45
        run: |
          set -o pipefail
          mkdir -p build
          docker run --rm -v "$PWD:/work" -w /work fedora:45 \
            bash scripts/build-fedora-gxde-gxtk7.sh 2>&1 | tee build/fedora.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gxde-gxtk7-fedora-45
          path: |
            build/fedora.log
            build/gxde-bernese-rpmbuild/RPMS
            build/gxde-bernese-rpmbuild/SRPMS
            build/gxde-gxtk7-rpmbuild/RPMS
            build/gxde-gxtk7-rpmbuild/SRPMS

  copr:
    needs: build
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && vars.COPR_GXDE_GXTK7_PROJECT != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gxde-gxtk7-fedora-45
          path: result
      - name: Submit Bernese before GXTK7
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
          COPR_GXDE_GXTK7_PROJECT: ${{ vars.COPR_GXDE_GXTK7_PROJECT }}
        run: |
          set -euo pipefail
          test -n "$COPR_CONFIG"
          python3 -m pip install --user copr-cli
          umask 077
          config=$(mktemp)
          trap 'rm -f "$config"' EXIT
          printf '%s\n' "$COPR_CONFIG" > "$config"
          copr="$HOME/.local/bin/copr-cli --config $config"
          chroots=(--chroot fedora-45-x86_64 --chroot fedora-45-aarch64)
          for package in gxde-bernese gxde-gxtk7; do
            mapfile -t srpms < <(find result -name "$package-*.src.rpm")
            test "${#srpms[@]}" -eq 1
            $copr build "${chroots[@]}" "$COPR_GXDE_GXTK7_PROJECT" "${srpms[0]}"
          done

  record:
    needs: [sources, build, copr]
    if: >-
      always() && needs.build.result == 'success' &&
      (needs.copr.result == 'success' || needs.copr.result == 'skipped') &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gxde-gxtk7-sources
          path: candidate
      - name: Record successfully built tags
        run: |
          cp candidate/packages/gxde-gxtk7/upstream-lock.json packages/gxde-gxtk7/upstream-lock.json
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add packages/gxde-gxtk7/upstream-lock.json
            git commit -m 'Update GXTK7 release tags after Fedora builds'
            git push
