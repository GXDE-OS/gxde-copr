name: flakewm Fedora
on:
  push:
    paths: ['packages/flakewm/**', 'scripts/**', 'tests/**', '.github/workflows/flakewm.yml']
  pull_request:
    paths: ['packages/flakewm/**', 'scripts/**', 'tests/**', '.github/workflows/flakewm.yml']
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: flakewm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sources:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - id: resolve
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == schedule || "$EVENT" == workflow_dispatch ]]; then
            python3 scripts/flakewm-sources.py update
          fi
          if [[ "$EVENT" != schedule ]] || ! git diff --quiet -- packages/flakewm/upstream-lock.json; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
            python3 scripts/flakewm-sources.py prepare
          fi
      - uses: actions/upload-artifact@v4
        if: steps.resolve.outputs.build == 'true'
        with:
          name: flakewm-sources
          path: |
            build/flakewm-rpmbuild/SOURCES
            build/flakewm-rpmbuild/SPECS
            packages/flakewm/upstream-lock.json

  build:
    needs: sources
    if: needs.sources.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fedora: [45]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flakewm-sources
          path: .
      - name: Build and install in Fedora
        run: |
          set -o pipefail
          mkdir -p build
          docker run --rm -v "$PWD:/work" -w /work fedora:${{ matrix.fedora }} bash scripts/build-fedora-flakewm.sh 2>&1 | tee build/fedora.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flakewm-fedora-${{ matrix.fedora }}
          path: |
            build/fedora.log
            build/flakewm-rpmbuild/RPMS
            build/flakewm-rpmbuild/SRPMS

  copr:
    needs: build
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && vars.COPR_FLAKEWM_PROJECT != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flakewm-fedora-45
          path: result
      - name: Submit after the Fedora build passes
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
          COPR_FLAKEWM_PROJECT: ${{ vars.COPR_FLAKEWM_PROJECT }}
        run: |
          test -n "$COPR_CONFIG"
          python3 -m pip install --user copr-cli
          umask 077
          config=$(mktemp)
          trap 'rm -f "$config"' EXIT
          printf '%s\n' "$COPR_CONFIG" > "$config"
          mapfile -t srpms < <(find result -name '*.src.rpm')
          test "${#srpms[@]}" -eq 1
          "$HOME/.local/bin/copr-cli" --config "$config" build --chroot fedora-45-x86_64 --chroot fedora-45-aarch64 "$COPR_FLAKEWM_PROJECT" "${srpms[0]}"

  record:
    needs: [sources, build, copr]
    if: >-
      always() && needs.build.result == 'success' &&
      (needs.copr.result == 'success' || needs.copr.result == 'skipped') &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flakewm-sources
          path: candidate
      - name: Record successfully built tags
        run: |
          cp candidate/packages/flakewm/upstream-lock.json packages/flakewm/upstream-lock.json
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add packages/flakewm/upstream-lock.json
            git commit -m 'Update flakewm release tags after Fedora builds'
            git push
          fi
